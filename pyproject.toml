[project]
name = "document-intelligence"
version = "0.1.0"
description = "PyQt6 app for evaluating form-reading endpoints (RunPod VLM, Azure DI)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyQt6>=6.6",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
]

[project.scripts]
document-intelligence = "document_intelligence.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_intelligence"]
